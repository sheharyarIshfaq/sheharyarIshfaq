<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="gtornado" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1b2a5e"/></linearGradient></defs><rect width="590" height="250" rx="18" fill="url(#gtornado)"/><text x="30" y="46" font-size="14" font-weight="700" fill="#7aa7ff" letter-spacing="2">DEEP LEARNING</text>
<text x="30" y="86" font-size="29" font-weight="800" fill="#fff">tornado-prediction-ml</text><text x="30" y="122" font-size="18.5" fill="#dfe7ff">Predicts tornado occurrence in Texas from ERA5</text><text x="30" y="147" font-size="18.5" fill="#dfe7ff">weather data and NOAA storm records. Compares</text><text x="30" y="172" font-size="18.5" fill="#dfe7ff">Random Forest, 1D CNN and LSTM. 0.86 ROC-AUC.</text><rect x="30" y="198" width="71" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="66" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">Python</text><rect x="109.4" y="198" width="105" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="162" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">TensorFlow</text><rect x="222.4" y="198" width="122" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="283" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">scikit-learn</text><rect x="352.20000000000005" y="198" width="71" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="388" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">xarray</text><path d="M540 34 l14 0 l0 14 M554 34 l-18 18" stroke="#7aa7ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>