<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="gaiwrappers" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1b2a5e"/></linearGradient></defs><rect width="590" height="250" rx="18" fill="url(#gaiwrappers)"/><text x="30" y="46" font-size="14" font-weight="700" fill="#7aa7ff" letter-spacing="2">AI PRODUCT · CLIENT PROJECT</text>
<text x="30" y="86" font-size="29" font-weight="800" fill="#fff">AIWrappers</text><text x="30" y="122" font-size="18.5" fill="#dfe7ff">No-code AI app builder. Users describe a tool in</text><text x="30" y="147" font-size="18.5" fill="#dfe7ff">plain language and an agent generates it as a web</text><text x="30" y="172" font-size="18.5" fill="#dfe7ff">app. One inference layer over 39 models.</text><rect x="30" y="198" width="80" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="70" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">Next.js</text><rect x="117.8" y="198" width="105" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="170" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">PostgreSQL</text><rect x="230.8" y="198" width="130" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="296" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">Vercel AI SDK</text><rect x="369" y="198" width="71" height="28" rx="14" fill="#8cb4ff" fill-opacity="0.12" stroke="#8cb4ff" stroke-opacity="0.45"/><text x="405" y="216.9" font-size="14" font-weight="600" fill="#c9d6ff" text-anchor="middle">Stripe</text><path d="M540 34 l14 0 l0 14 M554 34 l-18 18" stroke="#7aa7ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>